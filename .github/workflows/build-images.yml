name: 构建 Incus 镜像

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - '**/*.py'
      - '镜像.md'
      - 'scripts/**'
      - '.github/workflows/**'
  schedule:
    - cron: '17 2 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: incus-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: 检查代码并生成构建矩阵
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: 检查语法并运行测试
        run: |
          printf '[开始] 检查 Python 语法。\n'
          python3 -m compileall -q build_pipeline.py scripts tests
          printf '[通过] Python 语法检查完成。\n'
          python3 scripts/run_tests.py
          printf '[开始] 检查初始化脚本语法。\n'
          bash -n scripts/setup-incus.sh
          printf '[通过] 初始化脚本语法检查完成。\n'
      - name: 根据镜像清单生成构建矩阵
        id: matrix
        run: |
          matrix=$(python3 build_pipeline.py --manifest '镜像.md' --matrix)
          printf 'matrix=%s\n' "$matrix" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$matrix" > build-matrix.json
      - name: 上传构建矩阵
        uses: actions/upload-artifact@v6
        with:
          name: build-matrix
          path: build-matrix.json
          retention-days: 7

  build:
    name: 构建 ${{ matrix.distro }} ${{ matrix.release }} / ${{ matrix.architecture }}
    needs: validate
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix: ${{ fromJSON(needs.validate.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      PYTHONUNBUFFERED: '1'
      TARGET_ARCH: ${{ matrix.architecture }}
      TARGET_DISTRO: ${{ matrix.distro }}
      TARGET_RELEASE: ${{ matrix.release }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: 安装并初始化 Incus
        run: bash scripts/setup-incus.sh
      - name: 构建预装通用软件包的镜像
        shell: bash
        run: |
          set -euo pipefail
          sudo --preserve-env=GITHUB_STEP_SUMMARY,PYTHONUNBUFFERED \
            python3 build_pipeline.py --manifest '镜像.md' \
              --architecture "$TARGET_ARCH" --distro "$TARGET_DISTRO" \
              --release "$TARGET_RELEASE" --output-dir dist --setup-diagnostics
      # Keep package downloads on the existing IPv4 build network. Enable a
      # private IPv6 subnet only for post-export acceptance; no public IPv6 needed.
      - name: 启用内部 IPv6 网络用于验收
        run: |
          sudo incus network set incusbr0 ipv6.nat true
          sudo incus network set incusbr0 ipv6.address auto
      - name: 重新导入镜像并验收 IPv4 和 IPv6
        id: acceptance
        timeout-minutes: 20
        run: |
          sudo --preserve-env=GITHUB_STEP_SUMMARY,PYTHONUNBUFFERED \
            python3 -I scripts/accept_image.py --output-dir dist \
              --architecture "$TARGET_ARCH" --distro "$TARGET_DISTRO" \
              --release "$TARGET_RELEASE" --report-dir acceptance
      - name: 设置验收报告读取权限
        if: ${{ always() && steps.acceptance.outcome != 'skipped' }}
        run: |
          if sudo test -d acceptance; then
            sudo chown -R "$(id -u):$(id -g)" acceptance
            chmod -R u+rwX acceptance
          fi
      - name: 上传验收报告
        if: ${{ always() && steps.acceptance.outcome != 'skipped' }}
        uses: actions/upload-artifact@v6
        with:
          name: acceptance-${{ matrix.distro }}-${{ matrix.release }}-${{ matrix.architecture }}
          path: acceptance/
          if-no-files-found: error
          retention-days: 7
      - name: 设置镜像文件读取权限
        run: |
          sudo chown -R "$(id -u):$(id -g)" dist
          chmod -R u+rwX dist
      - name: 上传已验收的镜像文件
        uses: actions/upload-artifact@v6
        with:
          name: images-${{ matrix.distro }}-${{ matrix.release }}-${{ matrix.architecture }}
          path: dist/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: 失败时收集诊断信息
        if: failure()
        shell: bash
        run: |
          mkdir -p diagnostics
          df -h > diagnostics/disk.txt
          sudo journalctl -u incus --no-pager -n 200 > diagnostics/incus.log 2>&1 || true
          sudo incus list --format json > diagnostics/instances.json 2>&1 || true
          ip -4 address show > diagnostics/host-addresses.txt 2>&1 || true
          ip -4 route show table all > diagnostics/host-routes.txt 2>&1 || true
          ip -6 address show > diagnostics/host-ipv6-addresses.txt 2>&1 || true
          ip -6 route show table all > diagnostics/host-ipv6-routes.txt 2>&1 || true
          sudo iptables -S FORWARD > diagnostics/forward-rules.txt 2>&1 || true
          sudo iptables -S DOCKER-USER > diagnostics/docker-user-rules.txt 2>&1 || true
          sudo incus network show incusbr0 > diagnostics/incus-network.txt 2>&1 || true
          if sudo test -f dist/build-summary.json; then
            sudo cp dist/build-summary.json diagnostics/
          fi
      - name: 上传诊断信息
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: diagnostics-${{ matrix.distro }}-${{ matrix.release }}-${{ matrix.architecture }}
          path: diagnostics/
          retention-days: 7

  verify:
    name: 验证双架构构建完整性
    permissions:
      contents: read
      actions: read
    needs: [validate, build]
    if: ${{ always() && github.event_name != 'pull_request' && needs.validate.result == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - name: 检出代码
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: 确认所有矩阵任务通过
        env:
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          if [ "$BUILD_RESULT" != success ]; then
            printf '[错误] 镜像矩阵未全部通过，请查看各任务的中文验收报告。\n'
            exit 1
          fi
          printf '[通过] 所有镜像矩阵任务均已通过。\n'
      - name: 下载构建矩阵
        uses: actions/download-artifact@v7
        with:
          name: build-matrix
          path: expected
      # Download/verify/delete one artifact at a time instead of filling a runner
      # with all 30 images. Image artifacts remain available from this run.
      - name: 验证校验和及预期产物
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 scripts/verify_artifacts.py --matrix expected/build-matrix.json --run-id "$GITHUB_RUN_ID"
